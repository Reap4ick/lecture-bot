name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name LectureBot `
            --add-data "templates;templates" `
            launcher.py
          Copy-Item deepl_keys.txt.example dist/LectureBot/deepl_keys.txt.example
          Compress-Archive -Path dist/LectureBot -DestinationPath dist/LectureBot-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LectureBot-Windows
          path: dist/LectureBot-Windows.zip
          if-no-files-found: error
